<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de monedas</title>
</head>
<body>
    <h1>Conversor de monedas</h1>

    <form id="formulario">
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="0" step="0.01" required>

        <label for="tipoConversion">Tipo de conversión:</label>
        <select id="tipoConversion">
            <option value="eurosDolares">Euros a dólares</option>
            <option value="dolaresEuros">Dólares a euros</option>
        </select>

        <button type="submit">Convertir</button>
    </form>

    <p id="resultado"></p>

    <script>
        const formulario = document.getElementById('formulario');
        const cantidad = document.getElementById('cantidad');
        const tipoConversion = document.getElementById('tipoConversion');
        const resultado = document.getElementById('resultado');

        const cambio = 1.09;

        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();

            const numero = Number(cantidad.value);
            let conversion;

            if (tipoConversion.value === 'eurosDolares') {
                conversion = numero * cambio;
                resultado.textContent = numero + ' euros son ' + conversion.toFixed(2) + ' dólares.';
            } else {
                conversion = numero / cambio;
                resultado.textContent = numero + ' dólares son ' + conversion.toFixed(2) + ' euros.';
            }
        });
    </script>
</body>
</html>
