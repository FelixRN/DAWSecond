<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps y reduce</title>
</head>
<body>
    <script>
        let notas = [3, 5, 7, 3, 7, 9, 6, 2, 6, 9, 8, 3, 5, 7, 8];

        let cantidadNotas = notas.length;
        let totalS = notas.reduce((valorAnt, valorAct) => valorAnt + valorAct);
        let media = parseInt(totalS / cantidadNotas);

        console.log("Suma de las notas:", totalS);
        console.log("Cantidad de notas:", cantidadNotas);
        console.log("Media:", media);

        let notas2 = [3, 5, 7, 3, 7, 9, 6, 2, 6, 9, 8, 3, 5, 7, 8];
        let notaMasAlta = notas.reduce((valorAnt, valorAct) => {
            if (valorAnt > valorAct){
                return valorAnt;
            }
            return valorAct;
        });
        console.log("Nota más alta: ", notaMasAlta);

        let precios = [3, 5, 7, 3, 7, 9, 6, 2, 6, 9, 8, 3, 5, 7, 8];
        let preciosConIVA = parseInt(precios.map(precio => precio*1.10));
        console.log("Precios con IVA: ", preciosConIVA);

    </script>
</body>
</html>
