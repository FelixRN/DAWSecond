    <script>
        function nombre(nombre, apellido) {

            document.write("Hola Sr/Sra " + nombre + " " + apellido + "<br> <br>");
        }
        nombre();
        
        function multiplicacion(num1, num2) {
            var num1 = prompt("Introduzca un número: ");
            var num2 = prompt("Introduzca otro número: ");
            var resultadoM = parseInt(num1) * parseInt(num2);
            var resultadoR = parseInt(num1) - parseInt(num2);
            var resultadoD = parseInt(num1) / parseInt(num2);

            document.write("La multiplicación de " + num1 + " y "  + num2 + " es: " + resultadoM + "<br>");
            document.write("La resta de " + num1 + " y "  + num2 + " es: " + resultadoR + "<br>");
            document.write("La división de " + num1 + " y "  + num2 + " es: " + resultadoR + "<br>");
        }
        multiplicacion();

        function operacion(base, altura) {
            var base = parseInt(prompt("Dime la base de un rectangulo: "));
            var altura = parseInt(prompt("Dime la altura de un rectangulo"));
            var perimetro = 2 * (base + altura);
            var superficie = base * altura;

            document.write("El perimetro del rectangulo es: " + perimetro + "<br> <br>");
            document.write("La superficie del rectangulo es: " + superficie + "<br> <br>");         
        }
        operacion();
    
    </script>
