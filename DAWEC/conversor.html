<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de divisas</title>
    <style>
        :root {
            --ink: #17221f;
            --muted: #69736f;
            --paper: #fffdf8;
            --mint: #cce8d6;
            --green: #176b4a;
            --line: #dfe7e1;
            --shadow: 0 24px 60px rgba(23, 61, 45, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: linear-gradient(135deg, #eaf5e9 0%, #f8efe0 100%);
            font-family: Georgia, 'Times New Roman', serif;
        }

        main {
            width: min(100%, 560px);
            padding: clamp(28px, 6vw, 52px);
            background: var(--paper);
            border: 1px solid rgba(23, 107, 74, 0.12);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font: 700 0.78rem/1.2 Arial, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 390px;
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 4rem);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .intro {
            margin: 18px 0 30px;
            color: var(--muted);
            font: 1rem/1.6 Arial, sans-serif;
        }

        form {
            display: grid;
            gap: 16px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            font: 700 0.88rem/1.2 Arial, sans-serif;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .input-wrap:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(23, 107, 74, 0.12);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 15px 16px;
            border: 0;
            outline: 0;
            color: var(--ink);
            background: transparent;
            font: 1.15rem Arial, sans-serif;
        }

        .currency {
            padding: 0 16px;
            color: var(--green);
            font: 700 0.85rem Arial, sans-serif;
        }

        .swap {
            justify-self: center;
            width: 42px;
            height: 42px;
            border: 1px solid var(--green);
            border-radius: 50%;
            color: var(--green);
            background: var(--mint);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .swap:hover,
        .swap:focus-visible {
            background: #b6ddc4;
        }

        .rate {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
            color: var(--muted);
            font: 0.82rem/1.4 Arial, sans-serif;
        }

        .rate input {
            width: 90px;
            padding: 4px 6px;
            border-bottom: 1px solid var(--green);
            text-align: right;
            font-size: 0.82rem;
        }

        .message {
            min-height: 1.4em;
            margin: 4px 0 0;
            color: var(--green);
            font: 0.85rem/1.4 Arial, sans-serif;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Cambio rápido</p>
        <h1>Euros a dólares, sin rodeos.</h1>
        <p class="intro">Introduce una cantidad y obtén su equivalente al instante. También puedes convertir dólares a euros.</p>

        <form id="converter-form">
            <div class="field">
                <label for="euros">Euros</label>
                <div class="input-wrap">
                    <input id="euros" name="euros" type="number" min="0" step="0.01" placeholder="0,00" inputmode="decimal">
                    <span class="currency">EUR</span>
                </div>
            </div>

            <button class="swap" id="swap-button" type="button" aria-label="Intercambiar monedas" title="Intercambiar monedas">&#8597;</button>

            <div class="field">
                <label for="dollars">Dólares americanos</label>
                <div class="input-wrap">
                    <input id="dollars" name="dollars" type="number" min="0" step="0.01" placeholder="0,00" inputmode="decimal">
                    <span class="currency">USD</span>
                </div>
            </div>

            <div class="rate">
                <span>Tipo de cambio: 1 EUR =</span>
                <label>
                    <input id="exchange-rate" type="number" min="0.0001" step="0.0001" value="1.09" aria-label="Dólares por euro">
                    USD
                </label>
            </div>
            <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const eurosInput = document.querySelector('#euros');
        const dollarsInput = document.querySelector('#dollars');
        const rateInput = document.querySelector('#exchange-rate');
        const swapButton = document.querySelector('#swap-button');
        const message = document.querySelector('#message');

        function convert(source) {
            const rate = Number(rateInput.value);
            const amount = Number(source.value);

            if (!rate || rate < 0 || source.value === '') {
                if (source.value === '') {
                    eurosInput.value = '';
                    dollarsInput.value = '';
                }
                message.textContent = '';
                return;
            }

            if (source === eurosInput) {
                dollarsInput.value = (amount * rate).toFixed(2);
            } else {
                eurosInput.value = (amount / rate).toFixed(2);
            }
            message.textContent = 'Conversión actualizada';
        }

        eurosInput.addEventListener('input', () => convert(eurosInput));
        dollarsInput.addEventListener('input', () => convert(dollarsInput));
        rateInput.addEventListener('input', () => {
            if (eurosInput.value) {
                convert(eurosInput);
            } else if (dollarsInput.value) {
                convert(dollarsInput);
            }
        });

        swapButton.addEventListener('click', () => {
            const eurosValue = eurosInput.value;
            eurosInput.value = dollarsInput.value;
            dollarsInput.value = eurosValue;
            eurosInput.focus();
            message.textContent = 'Monedas intercambiadas';
        });
    </script>
</body>
</html>
</head>

    <script>
        
    </script>
</body>
</html>
